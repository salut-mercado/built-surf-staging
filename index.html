    <!-- Restore the GitHub Pages 404 redirect before the bootstrap reads location. -->
    <script type="text/javascript" data-spa-redirect>
      // Single Page Apps for GitHub Pages
      // MIT License
      // https://github.com/rafgraph/spa-github-pages
      // This script checks to see if a redirect is present in the query string,
      // converts it back into the correct url and adds it to the
      // browser's history using window.history.replaceState(...),
      // which won't cause the browser to attempt to load the new url.
      // When the single page app is loaded further down in this file,
      // the correct url will be waiting in the browser's history for
      // the single page app to route accordingly.
      (function (l) {
        if (l.search[1] === "/") {
          var decoded = l.search
            .slice(1)
            .split("&")
            .map(function (s) {
              return s.replace(/~and~/g, "&");
            })
            .join("?");
          window.history.replaceState(
            null,
            null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      })(window.location);
    </script>
    <script data-appearance-bootstrap>

      (function () {
        var root = document.documentElement;
        var media = function (query) {
          return Boolean(window.matchMedia && window.matchMedia(query).matches);
        };

          try {

          // The customer display is always light; mirrors the palette rule in

          var displayTheme = "system";
          try {
            displayTheme =
              JSON.parse(read("global-store")).state.customerDisplayTheme ||
              displayTheme;
          } catch (error) {}

          if (
            displayTheme === "orange" ||
            (displayTheme === "system" && palette === "easy")
          )
            root.classList.add("palette-easy");
        } else {
          var theme = read("ui-theme");
          if (theme !== "light" && theme !== "dark") {
            theme = media("(prefers-color-scheme: dark)") ? "dark" : "light";
          }
          root.classList.add(theme);
          if (palette === "easy") root.classList.add("palette-easy");
        }
        var density = read("ui-density");
        if (density !== "normal" && density !== "touch") {
          density =
            window.salutDesktop ||
            window.navigator.maxTouchPoints > 0 ||
            media("(max-width: 767px), (pointer: coarse)")
              ? "touch"
              : "normal";
        }
        root.dataset.density = density;
      })();
    </script>
